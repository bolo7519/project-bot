# suitability_rules.yaml
#
# Eignungsbewertung (kostenlos, lokal, kein LLM) für fachlich erfasste Projekte.
#
# Abgrenzung:
#   - search_group_filters.yaml entscheidet, OB ein Projekt fachlich zu einer
#     Suchgruppe gehört (Erfassung).
#   - Diese Datei bewertet, WIE GUT ein erfasstes Projekt passt (Eignung).
#     Sie ändert nichts an der Erfassung und an den vier Kompetenzprofilen.
#
# Ein einzelner unerwünschter Begriff führt nie zum Ausschluss. Abgelehnt wird
# nur bei `unsupported_must_haves`, wenn der Begriff im TITEL steht UND im
# Muss-/Anforderungsabschnitt der Ausschreibung verlangt wird. Steht er nur im
# Muss-Abschnitt, gibt es einen Abzug; eine bloße Erwähnung bleibt folgenlos.
#
# Schreibweise der Begriffe wie in search_group_filters.yaml (ganze Wörter,
# Leerzeichen/Bindestrich austauschbar, "*" für Wortfortsetzungen).
#
# Hier stehen nur vom Nutzer genannte Schwerpunkte und Einschränkungen —
# keine Zertifikate, Referenzen oder Fähigkeiten, die nicht belegt sind.

suitability:

  # Punkte je unterschiedlichem Treffer und Obergrenze je Kategorie
  weights:
    high: 15
    medium: 8
    transferable: 4
    low_priority: -15
  caps:
    high: 45
    medium: 24
    transferable: 8
    low_priority: -45

  # Einstufung der fachlichen Eignung (0–100)
  thresholds:
    high: 50      # ab hier "hoch"
    medium: 25    # ab hier "mittel", darunter "niedrig"

  # Fundstelle eines Begriffs:
  #   - Steht er nur unter Nice-to-have ("von Vorteil", "wünschenswert"),
  #     zählt er mit diesem Faktor (15 → 4, 8 → 2 Punkte).
  nice_to_have_factor: 0.25
  #   - Steht ein Schwerpunkt im Projekttitel, gibt es einmalig einen Zuschlag.
  title_bonus:
    high: 15
    medium: 8
  # Höchstens ein fachlicher Treffer und kein Kernthema im Titel: Die fachliche
  # Eignung bleibt unter "mittel" — eine beiläufig erwähnte Technologie macht
  # kein passendes Projekt.
  single_mention_cap: 24

  # Höchstwert bei Ablehnung wegen einer nicht belegten Muss-Anforderung
  reject_score_cap: 10
  # Abzug, wenn die Muss-Anforderung nur im Anforderungsabschnitt steht
  must_have_penalty: -25

  groups:

    # ─────────────────────────────────────────────────────────────────────────
    automation_bi:
      high:
        # Power BI, DAX, Power Query, Datenaufbereitung, KPI-Dashboards,
        # Management Reporting (praktische Erfahrung)
        - "Power BI"
        - "Power Query"
        # "DAX" zählt nur im Power-BI-Zusammenhang, nicht bei "DAX-Konzern"
        - term: "DAX"
          with: ["Power BI", "Power Query", "DAX-Formel*", "DAX-Measure*", "Measure*"]
        - "Datenaufbereitung"
        - "Management Reporting"
        - "KPI-Dashboard*"
        - "KPI-Reporting"
        # CRM-Beratung und CRM-Integration, insbesondere Bitrix24 und Salesforce
        - "CRM"
        - "Bitrix24"
        - "Salesforce"
        # Make.com und Zapier, Workflow- und Geschäftsprozessautomatisierung
        - "Make.com"
        - "Integromat"
        - "Zapier"
        - "Workflow-Automatisierung"
        - "Workflow Automation"
        - "Prozessautomatisierung"
        - "Geschäftsprozessautomatisierung"
        - "Business Process Automation"
        # SharePoint und Microsoft 365
        - "SharePoint"
        - "Microsoft 365"
        - "M365"
        # SaaS-Integration und digitale Geschäftsprozesse
        - "SaaS-Integration*"
        - "API-Integration*"
        - "digitale Geschäftsprozesse"
        - "Prozessdigitalisierung"
      medium:
        # ActiveCampaign und Marketing Automation
        - "ActiveCampaign"
        - "Marketing Automation"
        # IT-Prozessberatung und technische Projektleitung
        - "IT-Prozessberatung"
        - "Prozessberatung"
        - "Technische Projektleitung"
        - "Projektleit*"
        # Integrationssignale (fertige App-Integrationen, Schnittstellen)
        - "REST-API"
        - "Webhook*"
        - "API-Anbindung*"
      # Übertragbare Kompetenz ohne eigene Praxis: geringe Punktzahl + Hinweis
      transferable:
        - "n8n"

    # ─────────────────────────────────────────────────────────────────────────
    infra_security:
      high:
        # IT-Infrastrukturmodernisierung
        - "IT-Infrastruktur*"
        - "IT Infrastructure"
        - "Infrastrukturmodernisierung*"
        - "IT-Modernisierung"
        # Sophos, Firewalls, VPN, WAN, Routing, Switching, Netzwerksegmentierung
        - "Sophos"
        - "Firewall*"
        - "VPN"
        - "WAN"
        - "Routing"
        - "Switching"
        - "Netzwerksegmentierung"
        - "Segmentierungskonzept*"
        - "Netzwerkarchitektur*"
        # Standortvernetzung und Infrastrukturmigration
        - "Standortvernetzung"
        - "Infrastrukturmigration*"
        # Senior Infrastructure Consulting
        - "Senior Infrastructure"
        - "Infrastructure Consult*"
        - "IT-Transformation*"
        # Interim IT Management und technische Projektleitung
        - "Interim IT*"
        - "Technische Projektleitung"
        - "Projektleit*"
      medium:
        # Microsoft 365, Active Directory, Virtualisierung
        - "Microsoft 365"
        - "M365"
        - "Active Directory"
        - "Virtualisierung"
        - "VMware"
        - "Hyper-V"
        # Infrastructure Security und Security Governance
        - "Infrastructure Security"
        - "Security Governance"
        - "IT-Sicherheit*"
        - "Informationssicherheit*"
        - "Sicherheitsarchitektur*"
        - "Sicherheitskonzept*"
      low_priority:
        # Helpdesk, First-Level-Support, reine Client-Rollouts
        - "Helpdesk"
        - "First-Level*"
        - "1st Level*"
        - "Supporter"
        - "Onsite-Support*"
        - "Vor-Ort-Support"
        - "Client-Rollout*"
        - "Hard- und Software Support"
        - "Field Service*"
        - "PC-Rollout*"
        - "Rollouter*"
        # SOC, Penetration Testing, Red Team, hochspezialisierte Cybersecurity
        - "SOC"
        - "SOC-Analyst*"
        - "Penetrationstest*"
        - "Penetration Test*"
        - "Pentest*"
        - "Red Team*"
        - "Schwachstellenmanagement"
        - "Vulnerability Management"
        - "Attack Surface*"
        - "Threat Hunting"
        - "Incident Response"

  # Gilt für beide Gruppen ───────────────────────────────────────────────────
  common:
    # Senior-Level, Beratung, Umsetzung, technische Projektleitung (einmalig)
    role:
      points: 10
      terms:
        - "Senior"
        - "Berater*"
        - "Beratung"
        - "Consultant*"
        - "Consulting"
        - "Projektleit*"
        - "Interim"

    # Kompetenzbonus für nachgewiesene praktische Fähigkeiten. Wird je Regel
    # höchstens einmal vergeben und VOR Spezialisten-Deckel und Muss-Prüfung
    # addiert — er kann also weder einen Deckel noch eine Ablehnung umgehen.
    competency_bonuses:
      - label: "Power BI mit nachgewiesener Praxis (DAX, Power Query, Reporting)"
        requires: ["Power BI"]        # Voraussetzung im Ausschreibungstext
        points_per_skill: 5
        max_points: 10
        skills:
          - term: "DAX"
            with: ["Power BI", "Power Query", "DAX-Formel*", "DAX-Measure*", "Measure*"]
          - "Power Query"
          # Reporting-Zusammenhang eines Power-BI-Projekts (Berichte erstellen
          # und erweitern, Dashboards, Datenanalyse). Zählt wie DAX und Power
          # Query nur zusammen mit Power BI und in denselben maximal 10 Punkten.
          - "Reporting"
          - "Reports"
          - "Berichte*"
          - "Dashboard*"
          - "KPI*"
          - "Datenanalyse*"
          - "Datenvisualisierung*"

    # Verlangte Kenntnisse, die der Bewerber nicht bestätigt hat. Sie führen
    # nicht zur Ablehnung, verhindern aber die Einstufung "hoch": Das Projekt
    # bleibt bei "Prüfen", bis die Kenntnis geklärt ist. Zählt nicht, wenn der
    # Begriff nur unter Nice-to-have steht.
    unconfirmed_requirements:
      - label: "Nicht bestätigte Power-BI-Plattformkenntnis"
        requires: ["Power BI"]
        terms:
          - "Power BI Premium"
          - "Premium Capacity"
          - "Premium-Kapazität*"
          - "Power BI Embedded"
          - "Power BI Report Server"

    # Nicht belegte Spezialisierungen. Ablehnung nur, wenn Begriff im Titel UND
    # im Muss-Abschnitt; nur im Muss-Abschnitt → Abzug; Erwähnung → nichts.
    unsupported_must_haves:
      - label: "Pega-Entwicklung"
        terms:
          - "Pega"
      - label: "SAP-Entwicklung/-Scripting"
        terms:
          - "Winshuttle"
          - "ABAP"
          - "SAP FI"
          - "SAP-Entwickl*"
          - "SAP Scripting"

    # Reine Spezialistenrollen: Viele passende Schlagworte dürfen fehlende,
    # zwingend geforderte Spezialerfahrung nicht überdecken. Die fachliche
    # Eignung wird auf `score_cap` begrenzt (keine Ablehnung), wenn
    #   - der Titel eine Spezialistenrolle nennt UND der Anforderungsabschnitt
    #     mindestens eine Spezialerfahrung verlangt, oder
    #   - der Anforderungsabschnitt mindestens zwei Spezialerfahrungen verlangt
    #     (je Regel einstellbar über min_required_without_title).
    # Nennt der Titel zusätzlich ein belegtes Kernthema (exempt_title_terms),
    # greift die Regel erst ab min_required_with_exempt_title Anforderungen.
    # Infrastrukturberatung mit Security-Anteil (Firewalls, Segmentierung,
    # Sicherheitskonzepte) ist davon nicht betroffen.
    specialist_roles:
      - label: "Reine Cybersecurity-Spezialistenrolle"
        score_cap: 40
        title_terms:
          - "Cybersecurity"
          - "Cyber Security"
          - "Security Engineer*"
          - "Security Analyst*"
          - "Security Architect*"
          - "SOC*"
          - "Pentest*"
          - "Penetration*"
          - "Red Team*"
          - "Schwachstellenmanagement"
          - "Vulnerability*"
          - "Threat*"
        required_experience_terms:
          - "technischen Informationssicherheit"
          - "technische Informationssicherheit"
          - "Cyber Threat*"
          - "Cyberangriff*"
          - "Cyberbedrohung*"
          - "Angriffsmuster"
          - "Angriffsmethoden"
          - "Attack Surface*"
          - "Schwachstellenmanagement"
          - "Vulnerability Management"
          - "Cyber Risk*"
          - "Penetrationstest*"
          - "Pentest*"
          - "Incident Response"
          - "Threat Hunting"
          - "Red Team*"
          - "SIEM"
          - "SOC"

      # Praktische Power-BI-Arbeit (Berichte, DAX, Power Query, Dashboards) ist
      # belegt. Nicht belegt sind Data-Engineering-/Plattform-Spezialisierungen
      # und Zertifikate; sie deckeln nur, wenn sie zwingend verlangt werden.
      - label: "Reine Data-Engineering-/BI-Plattform-Spezialistenrolle"
        score_cap: 40
        title_terms:
          - "Data Engineer*"
          - "Data Scientist*"
          - "Data Architect*"
          - "Datenarchitekt*"
          - "BI-Architekt*"
          - "Data Warehouse*"
          - "DWH*"
          - "Databricks"
          - "Snowflake"
        required_experience_terms:
          - "Data Warehouse*"
          - "DWH*"
          - "Data Vault"
          - "Databricks"
          - "Snowflake"
          - "Azure Synapse"
          - "Synapse Analytics"
          - "Azure Data Factory"
          - "Data Lake*"
          - "PySpark"
          - "Python"
          - "SSIS"
          - "SSAS"
          - "Tabular Editor"
          - "PL-300"
          - "DP-600"
          - "DP-500"
          - "Microsoft Certified*"

      # Reine Softwareentwicklung ist nicht belegt (keine Entwicklerpraxis in
      # Angular, Java, .NET, Mainframe usw.). Der Deckel liegt unter der
      # Schwelle "mittel", damit solche Rollen nicht bei "Prüfen" landen.
      # Ausdrücklich NICHT pauschal betroffen: Power BI, DAX, Power Query,
      # CRM-Integration und Prozessautomatisierung. Steht eines dieser Themen
      # im Titel ("Power BI Entwickler", "CRM-Entwickler"), greift der Deckel
      # nur, wenn mindestens zwei nicht belegte Entwicklungsanforderungen
      # zwingend verlangt werden (z.B. Plugin-Entwicklung UND C#).
      - label: "Reine Softwareentwicklerrolle"
        score_cap: 20
        min_required_with_title: 1
        min_required_with_exempt_title: 2
        min_required_without_title: 3
        title_terms:
          - "Developer*"
          - "Entwickler*"
          - "Softwareentwickl*"
          - "Software Engineer*"
          - "Software-Ingenieur*"
          - "Programmierer*"
          - "Fullstack*"
          - "Full Stack*"
          - "Backend*"
          - "Frontend*"
          - "Mainframe*"
        exempt_title_terms:
          - "Power BI"
          - "Power Query"
          - "DAX"
          - "CRM"
          - "Salesforce"
          - "Bitrix24"
          - "Make.com"
          - "Zapier"
          - "Prozessautomatisierung"
          - "Workflow-Automatisierung"
          - "SharePoint"
        required_experience_terms:
          - "Angular"
          - "React"
          - "Vue.js"
          - "TypeScript"
          - "JavaScript"
          - "Java"
          - "Spring Boot"
          - "Kotlin"
          - "Swift"
          - "C#"
          - ".NET"
          - "C++"
          - "Blazor"
          - "Python"
          - "PHP"
          - "Node.js"
          - "Scala"
          - "Cobol"
          - "CICS"
          - "JCL"
          - "ADABAS"
          - "PL/SQL"
          - "ABAP"
          - "Apex"
          - "VBA"
          - "Microservices"
          - "Camunda"
          - "Lotus Notes"
          - "Plugin*"
          - "Script Includes"
          - "ServiceNow-Entwicklung"
          - "Programmiererfahrung"
          - "Entwicklungserfahrung"
          - "Erfahrung in der Entwicklung"
          - "Erfahrung in der Softwareentwicklung"
          - "Erfahrung als Entwickler*"

  # Rahmenbedingungen — getrennt von der fachlichen Eignung ───────────────────
  # Jede Angabe erhält einen Status: erfüllt / teilweise / nicht erfüllt /
  # unbekannt. Fehlende Angaben gelten als "unbekannt", nie als erfüllt.
  conditions:
    # Vertragsart: Gesucht sind Freelance-Projekte. Festanstellung und
    # Anbieterwerbung (ein Anbieter sucht selbst Kunden oder Partner) sind
    # keine Projekte → "Nicht bewerben". Personalverleih/ANÜ → "teilweise".
    # Ohne Angabe bleibt die Vertragsart "unbekannt".
    contract_type:
      freelance:
        # Ausgeschrieben statt "Freelance*": Der Plattformname "freelancermap"
        # in einer URL ist keine Angabe zur Vertragsart.
        - "Freelance"
        - "Freelancer"
        - "Freelancerin"
        - "Freelancer:in"
        - "Freelancing"
        - "Freelance-Projekt*"
        - "freiberuflich*"
        - "Freiberufler*"
        - "Contractor*"
        - "selbstständig*"
        - "selbständig*"
      employment:
        - "Festanstellung*"
        - "Arbeitsvertrag"
        - "Jahresgehalt"
        - "Bruttojahresgehalt"
        - "Ihr Gehalt"
        - "Direktvermittlung"
        - "permanent position"
      temporary_employment:
        - "Personalverleih"
        - "Arbeitnehmerüberlassung"
        - "ANÜ"
        - "AÜG"
        - "Temporäranstellung"
        - "Payrolling"
      advertisement_title:
        - "Pilotkunde*"
        - "Referenzkunde*"
        - "Kunden gesucht"
        - "Vermittlungspartner*"
        - "Vertriebspartner*"
        - "Sonderkonditionen"
    work_mode:               # Remote bevorzugt
      onsite_only:
        - "kein Remote"
        - "Full-Onsite"
        - "100% vor Ort"
        - "100 % vor Ort"
        - "ausschließlich vor Ort"
        - "vollständig vor Ort"
      hybrid:
        - "hybrid"
        - "anteilig vor Ort"
        - "teilweise vor Ort"
        - "teilweise remote"
        - "anteilig remote"
        - "Remote-Anteil"
        - "Remoteanteil"
        - "Homeoffice-Anteil"
      remote:
        - "Remote"
        - "Homeoffice"
        - "Home Office"
    workload:                # 20–40 Stunden pro Woche bevorzugt
      preferred_hours_min: 20
      preferred_hours_max: 40
      full_time_hours: 40
    # Abzüge im Gesamtwert bei verletzten Rahmenbedingungen (keine Zuschläge)
    score_adjustments:
      onsite_only: -20
      workload_outside: -10
      not_freelance: -20

  # Verfügbarkeit des Bewerbers. null = nicht konfiguriert: der Starttermin
  # wird dann nur angezeigt, nicht geprüft, und es gibt keinen Abzug.
  # Setzen entweder hier oder (Vorrang) in config.yaml:
  #   applicant:
  #     available_from: "2026-12-01"
  applicant:
    available_from: null
