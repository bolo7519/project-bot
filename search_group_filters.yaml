      # IT-Infrastruktur
      - "IT-Infrastruktur*"
      - "IT Infrastructure"
      - "Serverinfrastruktur"
      - "Rechenzentrum*"
      - "Windows Server"
      - "VMware"
      - "Hyper-V"
      - "Systemadministr*"
      - "IT-Administr*"
      - "Systemintegration"
      # Netzwerk
      - "Netzwerkinfrastruktur"
      - "Netzwerkadministr*"
      - "Netzwerktechnik*"
      - "Netzwerkarchitekt*"
      - "Netzwerksicherheit"
      - "Netzwerksegmentierung"
      - "Netzwerkmodernisierung"
      - "Netzwerkmigration"
      - "Netzwerkmanagement"
