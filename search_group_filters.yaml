# search_group_filters.yaml
#
# Fachliche Einschlusskriterien je Suchgruppe (versioniert, kein Geheimnis).
#
# Hintergrund: Beide Suchgruppen lesen denselben, ungefilterten
# FreelancerMap-Feed. Ohne diese Begriffe gilt jeder Feed-Eintrag als Treffer
# jeder Gruppe. Ein Projekt gehört nur dann zu einer Gruppe, wenn mindestens
# `include_min_matches` Begriffe in Titel, Beschreibung oder Schlagworten
# vorkommen. Passt es zu beiden Gruppen, wird es beiden zugeordnet (eine Datei).
#
# Diese Datei liefert die Standardwerte. Wer sie für eine Gruppe überschreiben
# will, setzt in config.yaml `search_groups.<id>.filters.include_terms`
# (eine leere Liste schaltet die fachliche Filterung dieser Gruppe ab).
#
# Schreibweise der Begriffe:
#   - Plaintext, Groß-/Kleinschreibung egal, nur ganze Wörter
#   - Leerzeichen und Bindestrich sind austauschbar: "Power BI" trifft auch
#     "PowerBI" und "Power-BI"
#   - "*" am Ende erlaubt Wortfortsetzungen: "Firewall*" trifft "Firewalls"
#   - Bewusst keine allgemeinen Einzelwörter wie "Make", "API", "Workflow",
#     "Netzwerk", "Infrastruktur", "Security", "Reporting" oder "KI" — sie
#     stehen in fast jeder Ausschreibung und erzeugen Fehltreffer.
#
# Starke und schwache Begriffe:
#   - `include_terms` (stark): ein Treffer irgendwo im Text genügt.
#   - `weak_include_terms` (schwach): Begriffe, die oft nur am Rand stehen
#     ("Kenntnisse in Entra ID", "Erfahrung mit IT-Infrastrukturen" unter
#     Nice-to-have). Sie erfassen ein Projekt nur, wenn sie im TITEL stehen
#     oder zusammen mit mindestens einem weiteren Fachbegriff der Gruppe
#     vorkommen. Sie sind damit nicht ausgeschlossen: Ein Projekt mit
#     "Microsoft 365" im Titel oder mit "IT-Infrastruktur" plus "Firewall"
#     wird weiterhin erfasst.
#   - Rollenbegriffe wie "IT-Projektleitung", "Interim CIO" oder
#     "Infrastrukturprojekt" (Gruppe B) sind ebenfalls schwach: im Titel
#     erfassen sie, im Fließtext nur mit fachlichem Zusammenhang. Eine
#     IT-Projektleitung für CRM, Automatisierung oder BI kommt über ihre
#     Fachbegriffe in Gruppe A.
#
# Die vier Kompetenzprofile (competency_profiles/) sind davon unabhängig:
# Jedes Projekt, das hier mindestens eine Gruppe passiert, wird gegen alle
# vier Profile bewertet.

search_group_filters:

  # ───────────────────────────────────────────────────────────────────────────
  # Gruppe A: CRM, Sales Automation, Make.com/Integromat, API-Integration,
  # Workflow-Automatisierung, KI-Prozessintegration, Power BI, SharePoint
  # ───────────────────────────────────────────────────────────────────────────
  automation_bi:
    include_min_matches: 1
    include_terms:
      # CRM & Sales Automation
      - "CRM"
      - "Salesforce"
      - "Bitrix24"
      - "HubSpot"
      - "Pipedrive"
      - "Zoho CRM"
      - "Dynamics 365"
      - "Dynamics CRM"
      - "Sales Automation"
      - "Vertriebsautomatisierung"
      - "Marketing Automation"
      - "ActiveCampaign"
      - "Lead-Management"
      # Make.com / Integromat und vergleichbare Integrationsplattformen
      - "Make.com"
      - "Integromat"
      - "Zapier"
      - "n8n"
      - "iPaaS"
      - "Power Automate"
      - "Power Platform"
      - "Power Apps"
      # API- und Systemintegration
      - "Schnittstellenintegration"
      - "SaaS-Integration*"
      # Workflow- und Prozessautomatisierung
      - "Workflow-Automatisierung"
      - "Workflow Automation"
      - "Workflow-Management"
      - "Prozessautomatisierung"
      - "Geschäftsprozessautomatisierung"
      - "Business Process Automation"
      - "Process Automation"
      - "Prozessdigitalisierung"
      - "digitale Geschäftsprozesse"
      - "IT-Prozessberatung"
      - "RPA"
      - "UiPath"
      # KI-Prozessintegration
      - "AI Integration"
      - "KI-Integration"
      - "AI Automation"
      - "KI-Automatisierung"
      - "Azure OpenAI"
      - "Copilot Studio"
      - "Microsoft Copilot"
      - "M365 Copilot"
      # Power BI & SharePoint
      - "Power BI"
      - "Power Query"
      - "Microsoft Fabric"
      - "Business Intelligence"
      - "BI-Reporting"
      - "Management Reporting"
      - "KPI-Dashboard*"
      - "KPI-Reporting"
      - "SharePoint"
    # Schwache Begriffe: nur im Titel oder zusammen mit einem weiteren
    # Fachbegriff (siehe Kopf der Datei). Kein globaler Ausschluss.
    weak_include_terms:
      - "API-Integration*"
      - "API-Anbindung*"
      - "API-Schnittstelle*"
      - "Systemintegration"
      - "KI-Agent*"
      - "AI Agent*"
      - "Generative KI"
      - "Generative AI"
      - "GenAI"
      - "LLM"
      - "ChatGPT"
      - "Microsoft 365"
      - "M365"

  # ───────────────────────────────────────────────────────────────────────────
  # Gruppe B: IT-Infrastruktur, Netzwerke, Sophos, Firewall, VLAN,
  # Microsoft 365, IT-Transformation, Security Assessments
  # ───────────────────────────────────────────────────────────────────────────
  infra_security:
    include_min_matches: 1
    include_terms:
      # IT-Infrastruktur
      - "Serverinfrastruktur"
      - "Rechenzentrum*"
      - "Windows Server"
      - "VMware"
      - "Hyper-V"
      - "Systemadministr*"
      - "IT-Administr*"
      # Netzwerk
      - "Netzwerkinfrastruktur"
      - "Netzwerkadministr*"
      - "Netzwerktechnik*"
      - "Netzwerkarchitekt*"
      - "Netzwerksicherheit"
      - "Netzwerksegmentierung"
      - "Netzwerkmodernisierung"
      - "Netzwerkmigration"
      - "Netzwerkmanagement"
      - "Netzwerk-Engineer*"
      - "Network Engineer*"
      - "Network Security"
      - "Network Infrastructure"
      - "VLAN*"
      - "SD-WAN"
      - "LAN/WAN"
      - "WAN"
      - "Standortvernetzung"
      - "VPN"
      # Firewall / Sophos
      - "Sophos"
      - "Firewall*"
      - "Fortinet"
      - "FortiGate"
      - "Palo Alto"
      - "Check Point"
      # Microsoft 365
      - "Active Directory"
      - "Intune"
      - "Exchange Online"
      # IT-Transformation
      - "IT-Transformation"
      - "IT-Modernisierung"
      - "Infrastrukturmodernisierung"
      - "Infrastrukturmigration*"
      - "Interim IT*"
      - "Security Governance"
      - "Virtualisierung"
      # Security Assessments / IT-Sicherheit
      - "Security Assessment*"
      - "Security Audit*"
      - "Sicherheitsaudit*"
      - "IT-Sicherheit*"
      - "IT-Security"
      - "Cyber Security"
      - "Cybersicherheit"
      - "ISO 27001"
      - "ISO/IEC 27001"
      - "ISMS"
      - "NIS-2"
      - "BSI-Grundschutz"
      - "IT-Grundschutz"
      - "SIEM"
      - "Penetrationstest*"
      - "Pentest*"
      - "Endpoint Security"
      - "Microsoft Defender"
      - "Zero Trust"
    # Schwache Begriffe: nur im Titel oder zusammen mit einem weiteren
    # Fachbegriff (siehe Kopf der Datei). Kein globaler Ausschluss.
    weak_include_terms:
      - "IT-Infrastruktur*"
      - "IT Infrastructure"
      - "Systemintegration"
      - "Microsoft 365"
      - "M365"
      - "Office 365"
      - "O365"
      - "Entra ID"
      - "Azure AD"
      - "Informationssicherheit*"
      # IT-Projektleitung, Interim IT Management, Infrastrukturprojektleitung
      - "IT-Projektleit*"
      - "IT-Projektmanag*"
      - "IT Project Manag*"
      - "Technische Projektleitung"
      - "Technischer Projektleiter"
      - "Technische Projektleiterin"
      - "Technical Project Manag*"
      - "Infrastrukturprojekt*"
      - "Infrastructure Project*"
      - "IT-Leiter*"
      - "IT-Leitung"
      - "Interim CIO"
      - "Interim CTO"
      - "Head of IT"

# ─────────────────────────────────────────────────────────────────────────────
# RSS-Vorfilter: spart Projektseiten-Abrufe.
#
# Steht im TITEL eines neuen Feed-Eintrags einer dieser Berufsbegriffe UND
# kommt in Titel und RSS-Kurztext kein einziger Fachbegriff einer Suchgruppe
# vor, gilt der Eintrag als fachfremd, ohne dass die Projektseite geladen wird.
# Sobald ein Fachbegriff im RSS-Text steht, wird die Seite wie gewohnt geladen.
#
# Zunächst konservativ: nur Berufsbezeichnungen aus Medizin/Pflege,
# Buchhaltung, Recruiting, Grafik/Übersetzung und Handwerk. Projektleiter-,
# Manager- und Ingenieurstitel stehen bewusst NICHT hier, auch wenn sie
# fachfremd wirken — dort entscheidet weiterhin der Text der Projektseite. Eine leere Liste
# schaltet den Vorfilter ab; dann wird jede neue Projektseite einmal geladen.
# In config.yaml lässt sich die Liste über `rss_prefilter.title_exclude_terms`
# überschreiben.
# ─────────────────────────────────────────────────────────────────────────────
rss_prefilter:
  title_exclude_terms:
    - "Assistenzarzt*"
    - "Facharzt*"
    - "Arzt"
    - "Ärztin"
    - "Pflegefachkraft*"
    - "Pflegekraft*"
    - "Buchhalter*"
    - "Anlagenbuchhalter*"
    - "Finanzbuchhalter*"
    - "Bilanzbuchhalter*"
    - "Lohnbuchhalter*"
    - "Steuerfachangestellte*"
    - "Recruiter*"
    - "Grafiker*"
    - "Grafikdesigner*"
    - "Werbedesigner*"
    - "Übersetzer*"
    - "Schweißer*"
    - "Elektriker*"
    - "Elektroniker*"
    - "Mechatroniker*"
